name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (tests + cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: ci_secret_key
          DATABASE_URL: sqlite:///./test.db
          ALLOW_SQLITE: "true"
          # Sin credenciales R2 reales en CI: la subida es simulada y esta URL
          # "fake" mantiene el flujo (image_url no vacía) sin escribir en R2.
          R2_PUBLIC_DOMAIN: https://fake-r2.local
        run: |
          python -m pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tests
        working-directory: frontend
        run: npm run test:ci

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  mobile:
    name: Mobile (Expo tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

  publish-image:
    name: Build y publicar imagen (CD con Podman)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend, mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar Podman
        run: podman --version

      - name: Nombre de imagen (dueño en minúsculas, GHCR lo exige)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/youprefer-api" >> "$GITHUB_ENV"

      - name: Login GHCR con Podman
        run: podman login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build imagen (etiquetas :main y :sha)
        run: |
          podman build \
            -t "$IMAGE:main" \
            -t "$IMAGE:${{ github.sha }}" \
            -f backend/Containerfile \
            backend

      - name: Push etiquetas a GHCR
        run: |
          podman push "$IMAGE:main"
          podman push "$IMAGE:${{ github.sha }}"